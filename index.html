<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16233A">
<title>تقارير المقاولين</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDF1; --surface:#FFFFFF; --ink:#16233A; --muted:#5E6A7D; --line:#D2D9E2;
  --me:#DDE6F3; --ok:#1D7A52; --ok-bg:#E3F2EA; --bad:#B8342A; --bad-bg:#FBE9E6; --hiviz:#EDB21C; --hiviz-bg:#FFF6DA; --focus:#2F6FDB;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0E1522; --surface:#172035; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2A3651; --me:#22314F;
  --ok:#4CC08A; --ok-bg:#153227; --bad:#F07A6C; --bad-bg:#3A1B19; --hiviz:#F2C24A; --hiviz-bg:#3A3015; --focus:#7FA8F5; color-scheme:dark;}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
b,.meta,.dv{font-variant-numeric:tabular-nums}

.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px)}
/* header */
.top{background:#16233A;color:#fff;padding:8px 14px 10px}
.top-in{max-width:820px;margin:0 auto}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.r1 h1{margin:0;font-size:1rem;font-weight:600;opacity:.85}
.ib{background:transparent;border:0;color:#fff;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:.92rem}
.ib:hover{background:rgba(255,255,255,.1)}
.r2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:4px}
.datebtn{position:relative;display:flex;align-items:center;gap:6px;font-size:1.15rem;font-weight:700;cursor:pointer}
.datebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;color-scheme:dark}
.datebtn::after{content:"▾";font-size:.8rem;opacity:.7}
#shifts{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.top .seg{background:transparent;border:0;color:#fff;padding:4px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.top .seg.on{background:#fff;color:#16233A}
#counter{margin-inline-start:auto;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.cdot{opacity:.8;margin-inline-start:4px}

/* chat */
#chat{overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 20px}
#chat>*{max-width:820px;margin-inline:auto}
.intro{margin-top:12vh;text-align:center;color:var(--muted)}
.intro-t{font-size:1.2rem;font-weight:600;color:var(--ink);margin:0 0 6px}
.intro-s{max-width:36em;margin:0 auto 14px;font-size:.92rem}
.me{display:flex;flex-direction:column;align-items:flex-start;margin:18px 0 8px}
.bubble-me{background:var(--me);border-radius:14px 14px 14px 4px;padding:8px 12px;white-space:pre-wrap;max-width:88%;font-size:.9rem;overflow-wrap:anywhere}
.bubble-me.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.me .t{font-size:.72rem;color:var(--muted);margin-top:2px}
.link{background:none;border:0;color:var(--focus);cursor:pointer;padding:2px 0;font-size:.82rem}
.bot{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.bot-note{margin:0;color:var(--muted);font-size:.88rem}
.bot-mini{margin:0;padding:6px 12px;background:var(--surface);border-radius:10px;font-size:.9rem;border:1px solid var(--line)}
.muted{color:var(--muted)} .warnc{color:#9A6B00}
@media (prefers-color-scheme:dark){.warnc{color:var(--hiviz)}}
.warn{margin:0;background:var(--hiviz-bg);border-inline-start:4px solid var(--hiviz);padding:6px 10px;border-radius:6px;font-size:.88rem}

.card{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--ok);border-radius:14px;padding:10px 14px 6px}
.card.s-incomplete{border-inline-start-color:var(--bad)}
.card.ask{border-inline-start-color:var(--hiviz)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ch h3{margin:0;font-size:1.1rem}
.meta{font-size:.75rem;color:var(--muted);white-space:nowrap}
.linebox{display:flex;gap:6px;align-items:flex-start;background:var(--paper);border-radius:8px;padding:6px 10px;margin:8px 0}
.line{margin:0;flex:1;font-size:.88rem;overflow-wrap:anywhere}
.line-prev{background:var(--paper);border-radius:8px;padding:6px 10px;font-size:.85rem;margin:6px 0;overflow-wrap:anywhere}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:2px 4px;font-size:1rem;border-radius:6px}
.icon-btn:hover{background:var(--line)}
.mats{width:100%;border-collapse:collapse;font-size:.92rem;margin:4px 0}
.mats th,.mats td{padding:5px 2px;border-top:1px solid var(--line);text-align:start;font-weight:400}
.mats tr:first-child th,.mats tr:first-child td{border-top:0}
.mats .ic{width:1.7em}
.mats .dv{text-align:end}
.mats tr.st-missing th,.mats tr.st-missing .dv,.mats tr.st-nophoto .dv,.mats tr.st-flagged .dv,.mats tr.st-none:not(.dim) .dv{color:var(--bad)}
.mats tr.dim{color:var(--muted)}
.sf{margin:8px 0 4px;font-weight:500;font-size:.95rem}
.sf.ok{color:var(--ok)} .sf.bad{color:var(--bad)} .sf.muted{font-weight:400;font-size:.88rem}
.chips{list-style:none;padding:0;margin:4px 0 6px;display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:1px 8px;font-size:.85rem}
.chip b{margin-inline-end:3px} .chip small{opacity:.8;margin-inline-start:3px}
.rev{background:var(--hiviz-bg);border-radius:6px;padding:4px 10px;font-size:.85rem;margin:6px 0}
.issues{list-style:none;padding:0;margin:6px 0;color:var(--bad);font-size:.92rem}
.notes{background:var(--paper);border-radius:8px;padding:5px 10px;font-size:.88rem;margin:6px 0}
details.um,details.more{margin:6px 0;font-size:.88rem}
details.um summary,details.more summary{cursor:pointer;color:var(--muted);padding:2px 0}
details.um ul{margin:4px 0;padding-inline-start:18px;color:var(--muted)}
.cf{display:flex;justify-content:flex-end;gap:4px;border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--hiviz)}100%{box-shadow:0 0 0 0 transparent}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}

/* composer */
.composer{background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.composer-in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#compose{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:9px 14px;background:var(--paper);min-height:44px;max-height:160px;line-height:1.45}
.send{width:44px;height:44px;border-radius:50%;border:0;background:#16233A;color:#fff;cursor:pointer;font-size:1.1rem;flex:none}
.send{transform:scaleX(-1)}
.send:disabled{opacity:.35;cursor:default}
@media (prefers-color-scheme:dark){.send{background:#E6EBF2;color:#0E1522}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn.primary{background:#16233A;color:#fff;border-color:#16233A}
@media (prefers-color-scheme:dark){.btn.primary{background:#E6EBF2;color:#0E1522;border-color:#E6EBF2}}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:3px 10px;font-size:.88rem}
.btn.danger{color:var(--bad)}
.sumbtn{flex:none;min-height:44px;border-radius:22px}

/* sheet */
dialog.sheet{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(540px,calc(100vw - 24px));max-height:88vh;overflow:hidden}
dialog.sheet.wide{width:min(720px,calc(100vw - 24px))}
dialog.sheet::backdrop{background:rgba(10,16,28,.55)}
@media (max-width:640px){dialog.sheet,dialog.sheet.wide{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92vh}}
#sheetBody{padding:16px 16px 0;overflow:auto;max-height:inherit}
.x{position:absolute;top:10px;inset-inline-end:10px;z-index:2;border:0;background:var(--paper);width:36px;height:36px;border-radius:50%;cursor:pointer}
.sh-title{margin:0 0 10px;font-size:1.15rem;padding-inline-end:44px}
.sub{font-size:.95rem;margin:16px 0 6px}
.summary{white-space:pre-wrap;background:var(--paper);border-radius:10px;padding:12px;font-family:var(--font);font-size:.9rem;margin:0;overflow-wrap:anywhere}
.sheet-actions{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:14px;border-top:1px solid var(--line)}
.names{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.nm{display:block;width:100%;text-align:start;background:transparent;border:0;padding:6px 4px;border-radius:6px;cursor:pointer}
button.nm:hover{background:var(--paper)}
li.nm{padding:4px 4px}
.archive{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.arow{width:100%;display:flex;flex-direction:column;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.ad{font-weight:600}.ac{color:var(--muted);font-size:.88rem}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field span{font-weight:500;font-size:.9rem}
.field input,#sheetBody textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;flex:none}
.sm{font-size:.85rem}
.me-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.me-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.ml{font-weight:500;min-width:6.5em}
.segs{display:flex;gap:3px;flex-wrap:wrap}
.seg.sm{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;cursor:pointer;min-height:34px;font-size:.82rem}
.seg.sm.on.k-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg.sm.on.k-nophoto,.seg.sm.on.k-missing{background:var(--bad);border-color:var(--bad);color:#fff}
.seg.sm.on.k-none{background:var(--muted);border-color:var(--muted);color:#fff}
.qty{width:84px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);min-height:34px}
.gh{font-size:.82rem;color:var(--muted);margin:10px 0 4px}
.items{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}
.tog{width:100%;display:grid;grid-template-columns:2em 1fr auto;gap:6px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;min-height:40px;font-size:.9rem}
.tog.bad{background:var(--bad-bg);border-color:transparent}
.tog .n{font-weight:700;color:var(--muted)}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,20px);background:#16233A;color:#fff;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center;font-size:.9rem}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="top-in">
    <div class="r1"><h1>تقارير المقاولين</h1>
      <div><button class="ib" data-act="archive">🗂 الأرشيف</button><button class="ib" data-act="settings" aria-label="الإعدادات">⚙️</button></div></div>
    <div class="r2">
      <label class="datebtn"><span id="dateLabel"></span><input id="date" type="date" aria-label="تغيير التاريخ"></label>
      <div id="shifts" role="group" aria-label="الوردية"></div>
      <button id="counter" data-act="counter"></button>
    </div>
  </div></header>

  <main id="chat" aria-live="polite"></main>

  <footer class="composer"><div class="composer-in">
    <button class="btn sumbtn" data-act="summary">📤 الملخص</button>
    <textarea id="compose" rows="1" placeholder="الصق رسالة المقاول هنا…" aria-label="رسالة المقاول"></textarea>
    <button class="send" id="sendBtn" data-act="send" aria-label="إرسال" disabled>➤</button>
  </div></footer>
</div>

<dialog id="sheet" class="sheet"><button class="x" data-act="close" aria-label="إغلاق">✕</button><div id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===================== CORE (pure logic, no DOM) ===================== */
(function (root) {
'use strict';

  { id: 'C04', name: 'الرؤيا المزدوجة', aliases: ['الرؤيا المزدوجة', 'الرؤية المزدوجة', 'الرويا المزدوجه', 'المزدوجة'] },

  { id: 'C12', name: 'افق البنيه',      aliases: ['افق البنيه', 'أفق البنية'] },
  { id: 'C13', name: 'الابصار',         aliases: ['الابصار', 'الإبصار'] },
  { id: 'C14', name: 'الرايه النجديه',  aliases: ['الرايه النجديه', 'الراية النجدية', 'النجديه'] },
  { id: 'C15', name: 'الاساس العريض',   aliases: ['الاساس العريض', 'الأساس العريض'] },

  { id: 'C17', name: 'الراجحي',         aliases: ['الراجحي'] },
];

const GROUPS = { DOCS: 'المستندات والإجراءات', PPE: 'معدات الوقاية', CARDS: 'البطاقات والشهادات', EQUIP: 'المعدات والأدوات' };

// kw = keywords (any), ex = exclude if present, req = must also contain one of these
const SAFETY_ITEMS = [
  { no: 1,  g: 'DOCS',  label: 'إجراءات العمل الآمن (عربي/إنجليزي/أردو)', short: 'إجراءات العمل الآمن', kw: ['اجراءات العمل الامن', 'العمل الامن', 'اجراءات العمل', 'اجراءات', 'safe work', 'method statement'] },

  { no: 3,  g: 'DOCS',  label: 'نموذج فريق العمل', short: 'نموذج فريق العمل', kw: ['نموذج فريق العمل', 'فريق العمل', 'فريق', 'work team', 'team'] },
  { no: 4,  g: 'PPE',   label: 'معدات الوقاية الشخصية', short: 'معدات الوقاية PPE', kw: ['معدات الوقايه الشخصيه', 'معدات الوقايه', 'الوقايه الشخصيه', 'الوقايه', 'ppe'] },
  { no: 5,  g: 'PPE',   label: 'الخوذة', short: 'الخوذة', kw: ['الخوذه', 'خوذه', 'helmet'] },

  { no: 7,  g: 'PPE',   label: 'حذاء السلامة', short: 'حذاء السلامة', kw: ['حذاء السلامه', 'الحذاء', 'حذاء', 'احذيه', 'safety shoes', 'shoes', 'boots'] },
  { no: 8,  g: 'PPE',   label: 'واقي الوجه', short: 'واقي الوجه', kw: ['واقي الوجه', 'واقي', 'face shield', 'فيس شيلد', 'شيلد'] },
  { no: 9,  g: 'PPE',   label: 'قفازات عازلة', short: 'قفازات عازلة', kw: ['قفازات عازله', 'قفازات العزل', 'قفاز عازل', 'عازله', 'insulating gloves', 'insulated gloves'] },
  { no: 10, g: 'PPE',   label: 'قفازات عمل', short: 'قفازات عمل', kw: ['قفازات عمل', 'قفازات العمل', 'قفاز عمل', 'work gloves'] },
  { no: 11, g: 'PPE',   label: 'سترة عاكسة', short: 'سترة عاكسة', kw: ['ستره عاكسه', 'الستره', 'ستره', 'عاكسه', 'vest', 'reflective'] },
  { no: 12, g: 'CARDS', label: 'بطاقة إصدار LV', short: 'بطاقة إصدار LV', kw: ['اصدار lv', 'lv', 'اصدار'] },
  { no: 13, g: 'CARDS', label: 'بطاقة استلام C5', short: 'بطاقة استلام C5', kw: ['استلام c5', 'c5'] },
  { no: 14, g: 'CARDS', label: 'شهادة تأهيل (Joint / End / Meters)', short: 'شهادة تأهيل', kw: ['شهاده تاهيل', 'تاهيل', 'joint', 'meters'] },
  { no: 15, g: 'CARDS', label: 'دورة إسعافات أولية', short: 'دورة إسعافات أولية', kw: ['اسعافات اوليه', 'اسعافات', 'اسعاف', 'first aid'] },
  { no: 16, g: 'CARDS', label: 'دورة مكافحة حريق', short: 'دورة مكافحة حريق', kw: ['مكافحه حريق', 'مكافحه الحريق', 'مكافحه', 'fire fighting', 'firefighting'] },
  { no: 17, g: 'EQUIP', label: 'أقفال السلامة', short: 'أقفال السلامة', kw: ['اقفال السلامه', 'الاقفال', 'اقفال', 'قفل', 'lockout', 'loto', 'locks', 'lock'] },
  { no: 18, g: 'EQUIP', label: 'حواجز حماية مؤقتة', short: 'حواجز مؤقتة', kw: ['حواجز حمايه', 'الحواجز', 'حواجز', 'حاجز', 'barriers', 'barrier'] },
  { no: 19, g: 'EQUIP', label: 'طفاية حريق', short: 'طفاية حريق', kw: ['طفايه حريق', 'طفايات', 'طفايه', 'الطفايه', 'fire extinguisher', 'extinguisher'], ex: ['فحص', 'بطاقه', 'inspection', 'tag'] },

const NEG_CH = /[\u274C\u274E\u2716\u2717\u2718\u{1F6AB}\u26D4\u{1F534}\u{1F7E5}]/u;

/* split one line into segments; each segment = {s,e,neg,pos} over L/N positions */
function segmentize(L) {
  const chars = [...L];

  const offs = []; let o = 0; for (const c of chars) { offs.push(o); o += c.length; } offs.push(o);

    if (ch === ')') { if (negStack.length && negStack[negStack.length - 1] === depth) { flush(i); negStack.pop(); gidStack.pop(); } depth = Math.max(0, depth - 1); continue; }

/* find material mentions and value-numbers inside normalized text t */
function findMentions(t) {

  const pending = first.first && PEND_CH.test(first.L) && !firstRest && lines.length === 1;
  const emptyName = first.first && !first.L.trim() && lines.length === 1;
  if (pending || emptyName) return { contractor: block.contractor, pending: true };

  const mats = {}, issues = [], safetyHits = {}, unmatched = [];
  let notes = '', inNotes = false;
  for (const { L, N, first: isFirst } of lines) {
    if (!L.trim()) continue;

    if (/^(ملاحظات|ملاحظه)/.test(N)) { inNotes = true; notes = L.replace(/^[^:：\-]*[:：\-]?/, '').trim(); continue; }
    if (!isFirst && HEADER_LINE.test(N)) continue;
    if (!isFirst && /^(المقاول|مقاول|اسم المقاول)/.test(N)) continue;
    let { num, text } = splitNumber(L);
    if (!num || num > 35) { num = null; text = L; }
    const off = L.length - text.length;
    const Lt = L.slice(off), Nt = N.slice(off);
    const { mentions } = findMentions(Nt);
    if (mentions.length) { parseFreeLine(Lt, Nt, mats, issues); continue; }
    const n = norm(Lt);
    const ms = matchSafety(n);
    const byNum = (num && num >= 1 && num <= 35) ? SAFETY_ITEMS[num - 1] : null;
    if (ms || byNum) {
      let item, conf;
      if (ms && byNum) { if (ms.item.id === byNum.id) { item = byNum; conf = 'high'; } else { item = ms.tie ? byNum : ms.item; conf = 'low'; } }

      continue;

    if (!/[:：]\s*$/.test(L)) unmatched.push(L);
  }

  const checklist = Object.keys(safetyHits).length >= 5;
  let safety = null;
  if (checklist) {
    safety = {};

      const hits = safetyHits[it.id];
      if (!hits) { safety[it.id] = { ok: false, reason: 'not_found', line: null, review: false }; continue; }
      const marks = [...new Set(hits.map(h => h.mark))];
      let ok = false, reason, review = hits.some(h => h.conf === 'low');
      if (marks.includes('conflict') || (marks.includes('yes') && marks.includes('no'))) { reason = 'conflict'; review = true; }
      else if (marks.includes('no')) reason = 'explicit_no';
      else if (marks.includes('yes') && !marks.includes('none')) ok = true;
      else if (marks.includes('yes')) { reason = 'conflict'; review = true; }
      else reason = 'unmarked';
      safety[it.id] = { ok, reason: ok ? null : reason, line: hits.map(h => h.raw).join(' | '), review };
    }
  } else {
    for (const id in safetyHits) if (safetyHits[id].some(h => h.mark === 'no')) {
      const it = SAFETY_ITEMS.find(x => x.id === id); const t = `${it.short} غير متوفر`;
      if (!issues.includes(t)) issues.push(t);
    }
  }
  return { contractor: block.contractor, pending: false, checklist, safety, materials: mats, issues, notes, unmatched };
}

function parseMessage(raw, opts) {

  const blocks = splitBlocks(lines);

    date: detectDate(text),
    shift: detectShift(lines.map(l => l.L), opts.shifts || []),
    reports: blocks.map(parseBlock),
    multi: blocks.length > 1,

function fmtN(x) { return Number.isInteger(x) ? String(x) : String(Math.round(x * 100) / 100); }

}
function matState(v) {

}
const MAT_STATE_LABEL = { ok: 'متوفر', nophoto: 'لا يوجد صورة', missing: 'لا يوجد', flagged: 'عليه ملاحظة ❌', none: 'لم يُذكر' };

function evaluate(r, settings) {

    if (st === 'none') { if (required.includes(m.id)) problems.push(`${m.short} لم يُذكر`); continue; }
    if (st === 'ok') ok.push(matText(m, v));
    else if (st === 'missing') problems.push(`${m.short} لا يوجد`);
    else if (st === 'nophoto') problems.push(`${matText(m, v)} لا يوجد صورة`);
    else problems.push(matText(m, v));
  }
  const miss = missingIds(r).map(id => SAFETY_ITEMS.find(i => i.id === id));
  if (miss.length) problems.push(`ملف السلامة ناقص ${miss.length}: ${miss.slice(0, 6).map(i => i.short).join('، ')}${miss.length > 6 ? ` و${miss.length - 6} غيرها` : ''}`);
  else if (!r.checklist && s.requireChecklist) problems.push('قائمة الاشتراطات لم تُرسل');
  (r.issues || []).forEach(x => problems.push(x));
  return { status: problems.length ? 'incomplete' : 'complete', ok, problems };
}
const ICONS = { complete: '✅', incomplete: '❌', pending: '🔄' };
function summaryLine(name, ev) {
  if (ev.status === 'pending') return `${name}🔄`;
  let s = name + ICONS[ev.status];
  if (ev.ok.length) s += `(${ev.ok.join(' & ')})`;
  ev.problems.forEach((p, i) => { s += (i === 0 && !ev.ok.length ? '' : ' - ') + `❌(${p})`; });

}
function fmtDMY(iso) { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function summaryText(date, shift, reportsById, settings) {
  const RANKS = { complete: 0, incomplete: 1, pending: 2 };
  const rows = CONTRACTORS.map((c, i) => ({ c, i, ev: evaluate(reportsById[c.id], settings) }))
    .sort((a, b) => RANKS[a.ev.status] - RANKS[b.ev.status] || a.i - b.i);
  const L = ['⚠️متطلبات السلامة⚠️', `التاريخ : ${fmtDMY(date)}`, `الوردية : ${shift}`, '', 'المتطلبات', 'متوفر ✅', 'غير متوفر ❌', 'غير متجاوب 🔄', '', '', 'المقاولين :', ''];
  rows.forEach(r => { L.push(summaryLine(r.c.name, r.ev)); L.push(''); });
  return L.join('\n').trim();
}

function templateText() {
  const L = ['المقاول: ', 'التاريخ: ', 'الوردية: ', '', 'اشتراطات السلامة (ضع ✅ على المتوفر و ❌ على غير المتوفر):'];
  for (const it of SAFETY_ITEMS) L.push(`${it.no}. ${it.label} `);
  L.push('', 'المواد الحرجة (اكتب لا يوجد صورة إذا ما فيه صورة):',
    'كابل مؤقت 70*4 (الطول بالمتر): ', 'كابل مؤقت 185*4 (الطول بالمتر): ', 'كابل 800 (الطول بالمتر): ', 'نهاية 50 (العدد): ', 'فني ريلاي: ', 'أجهزة الفحص: ', '', 'ملاحظات:');
  return L.join('\n');
}
const API = { templateText, CONTRACTORS, GROUPS, SAFETY_ITEMS, MATERIALS, REASONS, MAT_STATE_LABEL, ICONS, norm, parseMessage, evaluate, summaryLine, summaryText,

<script>

      d.createObjectStore('messages', { keyPath: 'id' }).createIndex('sessionId', 'sessionId');
      d.createObjectStore('meta', { keyPath: 'key' });

/* ---------- saving reports ---------- */
function reportRecord(cid, parsed, msgId, prev) {

async function send(raw) {

  return `<article class="card s-${e.status}" id="r-${r.contractorId}">
    <header class="ch"><h3>${ICONS[e.status]} ${esc(name)}</h3><span class="meta">${r.revision > 1 ? `تحديث ${r.revision} · ` : ''}${fmtTime(r.updatedAt)}</span></header>
    <div class="linebox"><p class="line">${esc(line)}</p><button class="icon-btn" data-act="copyLine" data-cid="${r.contractorId}" aria-label="نسخ السطر">📋</button></div>
    ${compact ? `<details class="more"><summary>التفاصيل</summary>${body}</details>` : body}
    <footer class="cf"><button class="btn sm ghost" data-act="edit" data-cid="${r.contractorId}">✏️ تعديل</button><button class="btn sm ghost danger" data-act="del" data-cid="${r.contractorId}" aria-label="حذف تقرير ${esc(name)}">🗑</button></footer>
  </article>`;
}

/* ---------- sheet ---------- */
const sheet = $('#sheet'); let editing = null;
function openSheet(html, cls = '') { $('#sheetBody').innerHTML = html; sheet.className = 'sheet ' + cls; if (!sheet.open) sheet.showModal(); $('#sheetBody').scrollTop = 0; }
function closeSheet() { if (sheet.open) sheet.close(); editing = null; }
sheet.addEventListener('close', () => { editing = null; });

function openCounter() {
  const got = CONTRACTORS.filter(c => S.reports[c.id]), left = CONTRACTORS.filter(c => !S.reports[c.id]);
  openSheet(`<h2 class="sh-title">المقاولين في هذي الوردية</h2>
    ${got.length ? `<h3 class="sub">استلمت (${got.length})</h3><ul class="names">${got.map(c => `<li><button class="nm" data-jump="${c.id}">${ICONS[ev(c.id).status]} ${esc(c.name)}</button></li>`).join('')}</ul>` : ''}
    <h3 class="sub">باقي 🔄 (${left.length})</h3>${left.length ? `<ul class="names">${left.map(c => `<li class="nm muted">${esc(c.name)}</li>`).join('')}</ul>` : '<p class="muted">كل المقاولين أرسلوا 👍</p>'}`);
}
function openSummary() {
  const t = Core.summaryText(S.date, S.shift, S.reports, S.settings);
  openSheet(`<h2 class="sh-title">📤 الملخص</h2><pre class="summary">${esc(t)}</pre>
    <div class="sheet-actions"><a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">فتح واتساب</a>
    <button class="btn primary" data-act="copySummary">نسخ الملخص</button></div>`, 'wide');
}

/* ---------- edit ---------- */
const MSTATES = [['ok', 'متوفر'], ['nophoto', 'بدون صورة'], ['missing', 'لا يوجد'], ['none', 'لم يُذكر']];
function openEdit(cid) {
  const r = S.reports[cid];
  editing = { cid, checklist: !!r.checklist, safety: clean(r.safety || Object.fromEntries(SAFETY_ITEMS.map(i => [i.id, { ok: true, reason: null }]))), materials: clean(r.materials), issues: r.issues.slice(), notes: r.notes };
  renderEdit();
}
function renderEdit() {
  const E = editing;
  const mats = MATERIALS.map(m => { const v = E.materials[m.id], st = Core.matState(v);
    return `<li class="me-row"><span class="ml">${esc(m.short)}</span>
      <span class="segs">${MSTATES.filter(([k]) => !(m.type === 'presence' && k === 'nophoto')).map(([k, l]) => `<button type="button" class="seg sm ${st === k || (st === 'flagged' && k === 'ok') ? 'on' : ''} k-${k}" data-mst="${m.id}" data-k="${k}">${l}</button>`).join('')}</span>
      ${m.type !== 'presence' ? `<input class="qty" type="number" inputmode="decimal" min="0" step="any" data-qty="${m.id}" value="${v && v.value != null ? v.value : ''}" placeholder="${m.type === 'quantity' ? 'العدد' : 'الطول'}" aria-label="${esc(m.short)}">` : ''}</li>`; }).join('');
  const items = Object.entries(GROUPS).map(([g, gn]) => `<h4 class="gh">${gn}</h4><ul class="items">${SAFETY_ITEMS.filter(i => i.g === g).map(i => { const v = E.safety[i.id];
    return `<li><button type="button" class="tog ${v.ok ? 'ok' : 'bad'}" data-item="${i.id}" aria-pressed="${v.ok}"><span class="n">${i.no}</span><span>${esc(i.label)}</span><span class="st">${v.ok ? '✅' : '❌'}</span></button></li>`; }).join('')}</ul>`).join('');
  openSheet(`<h2 class="sh-title">✏️ تعديل ${esc(cName(E.cid))}</h2>
    <h3 class="sub">المواد الحرجة</h3><ul class="me-list">${mats}</ul>
    <h3 class="sub">الاشتراطات</h3>
    <label class="check"><input type="checkbox" id="edCheck" ${E.checklist ? 'checked' : ''}> الرسالة فيها قائمة الـ 35</label>
    ${E.checklist ? `<details class="um" open><summary>اضغط أي عنصر لتغيير حالته</summary>${items}</details>` : ''}
    <h3 class="sub">ملاحظات النقص (كل سطر = ❌ مستقل)</h3>
    <textarea id="edIssues" rows="3" placeholder="مثال: الكليشة & الملف">${esc(E.issues.join('\n'))}</textarea>
    <h3 class="sub">ملاحظات عامة</h3><textarea id="edNotes" rows="2">${esc(E.notes)}</textarea>
    <div class="sheet-actions"><button class="btn ghost" data-act="close">إلغاء</button><button class="btn primary" data-act="saveEdit">حفظ</button></div>`, 'wide');
}
function syncEdit() { if (!editing) return; const a = $('#edIssues'), b = $('#edNotes'); if (a) editing.issues = a.value.split('\n').map(x => x.trim()).filter(Boolean); if (b) editing.notes = b.value.trim(); }
async function saveEdit() {
  syncEdit(); const E = editing, prev = S.reports[E.cid];
  const parsed = { checklist: E.checklist, safety: E.checklist ? E.safety : null, materials: E.materials, issues: E.issues, notes: E.notes, unmatched: prev.unmatched };
  const rec = reportRecord(E.cid, parsed, prev.messageId, prev);
  // keep the card attached to its original message: update that message's revision pointer
  const msg = S.messages.find(m => m.id === prev.messageId);
  if (msg) msg.results.forEach(x => { if (x.type === 'report' && x.cid === E.cid) x.revision = rec.revision; });
  await tx(['reports', 'messages'], 'readwrite', t => { t.objectStore('reports').put(rec); if (msg) t.objectStore('messages').put(msg); });
  closeSheet(); await load(false); notify(); toast(`تم حفظ ${cName(rec.contractorId)}`);
  const el = $('#r-' + rec.contractorId); if (el) { el.scrollIntoView({ block: 'center' }); flash(el); }
}

/* ---------- archive / settings / backup ---------- */
async function openArchive() {
  const [ss, reps] = await Promise.all([getAll('sessions'), getAll('reports')]);
  ss.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const rows = ss.map(s => { const rs = reps.filter(r => r.sessionId === s.id); const bad = rs.filter(r => Core.evaluate(r, S.settings).status === 'incomplete').length;
    return `<li><button class="arow" data-open="${esc(s.id)}"><span class="ad">${dayName(s.date)} ${Core.fmtDMY(s.date)} — ${esc(s.shift)}</span><span class="ac">✅ ${rs.length - bad} · ❌ ${bad} · 🔄 ${CONTRACTORS.length - rs.length}</span></button></li>`; }).join('');
  openSheet(`<h2 class="sh-title">🗂 الأرشيف</h2>${rows ? `<ul class="archive">${rows}</ul>` : `<p class="muted">ما فيه ورديات محفوظة للحين.</p>`}`);
}
function openSettings() {
  const s = S.settings;
  openSheet(`<h2 class="sh-title">⚙️ الإعدادات</h2>
    <label class="field"><span>الورديات (افصل بفاصلة)</span><input id="setShifts" value="${esc(s.shifts.join('، '))}"></label>
    <h3 class="sub">المواد اللي لازم تنذكر (إذا ما انذكرت تصير ❌)</h3>
    ${MATERIALS.map(m => `<label class="check"><input type="checkbox" class="reqm" value="${m.id}" ${s.requiredMaterials.includes(m.id) ? 'checked' : ''}> ${esc(m.label)}</label>`).join('')}
    <label class="check"><input type="checkbox" id="setChecklist" ${s.requireChecklist ? 'checked' : ''}> إذا الرسالة ما فيها قائمة الـ 35 يصير المقاول ❌</label>
    <h3 class="sub">نموذج الرسالة</h3><button class="btn ghost" data-act="template">📋 نسخ نموذج الرسالة للمقاولين</button>
    <h3 class="sub">النسخ الاحتياطي</h3><p class="muted sm">البيانات محفوظة في هذا المتصفح فقط.</p>
    <div class="row"><button class="btn ghost" data-act="backup">⬇️ تنزيل نسخة</button><label class="btn ghost">⬆️ استرجاع<input id="restoreIn" type="file" accept=".json,application/json" hidden></label></div>
    <h3 class="sub">هذي الوردية</h3><button class="btn ghost danger" data-act="clearSession">مسح محادثة ${esc(S.shift)} ${Core.fmtDMY(S.date)}</button>
    <div class="sheet-actions"><button class="btn ghost" data-act="close">إلغاء</button><button class="btn primary" data-act="saveSettings">حفظ</button></div>`);
}
async function backup() {
  const data = { app: 'contractors-chat', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, sessions: await getAll('sessions'), reports: await getAll('reports'), messages: await getAll('messages') };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `نسخة_تقارير_المقاولين_${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function restore(f) {
  let d; try { d = JSON.parse(await f.text()); } catch { return toast('الملف غير صالح.'); }
  if (d.app !== 'contractors-chat') return toast('هذا الملف مو نسخة من هذا التطبيق.');
  if (!confirm(`استرجاع ${d.sessions.length} وردية؟ المتطابق بيُستبدل.`)) return;
  await tx(['sessions', 'reports', 'messages', 'meta'], 'readwrite', t => { d.sessions.forEach(x => t.objectStore('sessions').put(x)); d.reports.forEach(x => t.objectStore('reports').put(x)); d.messages.forEach(x => t.objectStore('messages').put(x)); if (d.settings) t.objectStore('meta').put({ key: 'settings', value: d.settings }); });
  await loadSettings(); closeSheet(); await load(); toast('تم الاسترجاع');
}
async function clearSession() {
  if (!confirm('مسح كل رسائل وتقارير هذي الوردية؟ ما تقدر ترجعها إلا من نسخة احتياطية.')) return;
  await tx(['sessions', 'reports', 'messages'], 'readwrite', t => {
    t.objectStore('sessions').delete(sid());
    Object.values(S.reports).forEach(r => t.objectStore('reports').delete(r.id));
    S.messages.forEach(m => t.objectStore('messages').delete(m.id));
  });
  closeSheet(); await load(); notify(); toast('تم المسح');
}

/* ---------- helpers ---------- */
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
async function copy(text, done) { try { await navigator.clipboard.writeText(text); } catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } toast(done); }
function flash(el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function autoGrow() { const c = $('#compose'); c.style.height = 'auto'; c.style.height = Math.min(c.scrollHeight, 160) + 'px'; $('#sendBtn').disabled = !c.value.trim(); }

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.shift) { S.shift = d.shift; localStorage.setItem('cc-shift', S.shift); return load(); }
  if (d.jump) { closeSheet(); const el = $('#r-' + d.jump); if (el) { el.scrollIntoView({ block: 'center' }); flash(el); } else toast('بطاقته انستبدلت، شف آخر تحديث له'); return; }
  if (d.open) { const s = await getOne('sessions', d.open); closeSheet(); S.date = s.date; S.shift = s.shift; if (!S.settings.shifts.includes(s.shift)) S.settings.shifts.push(s.shift); return load(); }
  if (d.item && editing) { syncEdit(); const v = editing.safety[d.item]; editing.safety[d.item] = { ...v, ok: !v.ok, reason: v.ok ? 'manual' : null, review: false }; const y = $('#sheetBody').scrollTop; renderEdit(); $('#sheetBody').scrollTop = y; return; }
  if (d.mst && editing) {
    syncEdit(); const m = editing.materials[d.mst] || { value: null };
    const k = d.k, map = { ok: { mentioned: true, available: true, photo: null, flagged: false }, nophoto: { mentioned: true, available: true, photo: false, flagged: false }, missing: { mentioned: true, available: false, photo: null, flagged: false }, none: { mentioned: false, available: false, photo: null, flagged: false } };
    editing.materials[d.mst] = { ...m, ...map[k], value: (k === 'missing' || k === 'none') ? null : m.value };
    const y = $('#sheetBody').scrollTop; renderEdit(); $('#sheetBody').scrollTop = y; return;
  }
  switch (d.act) {
    case 'send': { const c = $('#compose'); const v = c.value; c.value = ''; autoGrow(); return send(v); }
    case 'expand': { const bb = b.previousElementSibling; bb.classList.toggle('clamp'); b.textContent = bb.classList.contains('clamp') ? 'عرض الرسالة كاملة' : 'إخفاء'; return; }
    case 'resolve': { const sel = $(`#ask-${d.msg}-${d.idx}`); if (!sel.value) return toast('اختر المقاول'); return resolveUnknown(d.msg, +d.idx, sel.value); }
    case 'copyLine': return copy(Core.summaryLine(cName(d.cid), ev(d.cid)), 'تم نسخ السطر');
    case 'edit': return openEdit(d.cid);
    case 'del': return deleteReport(d.cid);
    case 'saveEdit': return saveEdit();
    case 'summary': return openSummary();
    case 'copySummary': return copy(Core.summaryText(S.date, S.shift, S.reports, S.settings), 'تم نسخ الملخص');
    case 'counter': return openCounter();
    case 'archive': return openArchive();
    case 'settings': return openSettings();
    case 'template': return copy(Core.templateText(), 'تم نسخ النموذج');
    case 'backup': return backup();
    case 'clearSession': return clearSession();
    case 'close': return closeSheet();
    case 'saveSettings': {
      const shifts = $('#setShifts').value.split(/[،,]/).map(x => x.trim()).filter(Boolean);
      if (!shifts.length) return toast('لازم وردية وحدة على الأقل.');
      S.settings = { shifts, requiredMaterials: [...document.querySelectorAll('.reqm:checked')].map(x => x.value), requireChecklist: $('#setChecklist').checked };
      if (!shifts.includes(S.shift)) S.shift = shifts[0];
      await saveSettings(); closeSheet(); await load(false); return toast('تم حفظ الإعدادات');
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'date' && e.target.value) { S.date = e.target.value; load(); }
  if (e.target.id === 'edCheck' && editing) { syncEdit(); editing.checklist = e.target.checked; renderEdit(); }
  if (e.target.id === 'restoreIn') restore(e.target.files[0]);
});
document.addEventListener('input', e => {
  if (e.target.id === 'compose') autoGrow();
  if (e.target.dataset.qty && editing) {
    const id = e.target.dataset.qty, v = e.target.value === '' ? null : parseFloat(e.target.value);
    const m = editing.materials[id] || { mentioned: false, available: false, photo: null, flagged: false };
    editing.materials[id] = { ...m, value: v, ...(v != null && v > 0 && !m.available ? { mentioned: true, available: true } : {}) };
  }
});
const compose = $('#compose');
compose.addEventListener('paste', () => { const wasEmpty = !compose.value.trim(); setTimeout(() => { autoGrow(); if (wasEmpty && compose.value.trim()) { const v = compose.value; compose.value = ''; autoGrow(); send(v); } }, 30); });
compose.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('[data-act=send]').click(); } });

/* ---------- boot ---------- */
(async () => {
  try { db = await openDB(); } catch { document.body.innerHTML = '<p style="padding:30px;text-align:center">المتصفح منع التخزين. افتح الصفحة في متصفح عادي (مو التصفح الخفي).</p>'; return; }
  navigator.storage?.persist?.().catch(() => {});
  await loadSettings();
  const saved = localStorage.getItem('cc-shift'), h = new Date().getHours();
  S.shift = S.settings.shifts.includes(saved) ? saved : S.settings.shifts[h >= 15 && S.settings.shifts.length > 1 ? 1 : 0];
  await load(); autoGrow();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();

</script>
</body>
</html>
