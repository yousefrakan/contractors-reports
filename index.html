<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<title>تقارير المقاولين اليومية</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDF1; --surface:#FFFFFF; --ink:#16233A; --muted:#5E6A7D; --line:#D2D9E2;
  --ok:#1D7A52; --ok-bg:#E3F2EA; --bad:#B8342A; --bad-bg:#FBE9E6; --wait:#7C8698; --wait-bg:#EEF0F4;
  --hiviz:#EDB21C; --hiviz-bg:#FFF6DA; --focus:#2F6FDB;
  --r-lg:14px; --r-sm:8px;
  --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root{
  --paper:#0E1522; --surface:#172035; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2A3651;
  --ok:#4CC08A; --ok-bg:#153227; --bad:#F07A6C; --bad-bg:#3A1B19; --wait:#8D98AB; --wait-bg:#1D2740;
  --hiviz:#F2C24A; --hiviz-bg:#3A3015; --focus:#7FA8F5; color-scheme:dark; } }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num,b{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px 0}
.top-in{max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:1.05rem;font-weight:600;margin:0;opacity:.85}
.icons{display:flex;gap:4px}
.ibtn{background:transparent;border:0;color:#fff;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:.95rem}
.ibtn:hover{background:rgba(255,255,255,.1)}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:10px 0 12px}
.date-wrap{display:flex;flex-direction:column}
#dateLabel{font-size:1.45rem;font-weight:700;line-height:1.2}
#date{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--r-sm);padding:4px 8px;color-scheme:dark;width:max-content;margin-top:4px}
#shifts{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.top .seg{background:transparent;border:0;color:#fff;padding:6px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.top .seg.on{background:#fff;color:var(--ink)}
#sessionState{font-size:.85rem;opacity:.8}
.link{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0 4px}

/* roster — the signature strip: one tick per contractor */
.roster-wrap{margin:0 -16px;padding:0 16px 12px;background:var(--ink)}
#roster{display:grid;grid-template-columns:repeat(17,1fr);gap:3px;max-width:1180px;margin:0 auto}
.tick{height:22px;border:0;border-radius:3px;cursor:pointer;padding:0;transition:transform .15s}
.tick:hover{transform:scaleY(1.25)}
.t-complete{background:var(--ok)} .t-incomplete{background:var(--bad)} .t-pending{background:rgba(255,255,255,.18)}
@media (prefers-color-scheme:dark){ .t-complete{background:#2E9A68} .t-incomplete{background:#D2493C} }

main{max-width:1180px;margin:0 auto;padding:14px 16px 110px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
#tally{display:flex;gap:6px;flex-wrap:wrap}
.tf{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.tf.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.search{flex:1 1 180px;min-width:150px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
@media (prefers-color-scheme:dark){ .btn.primary{background:#E6EBF2;color:#0E1522} }
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:4px 12px;font-size:.9rem}
.btn.danger{color:var(--bad)}
.btn.big{min-height:52px;font-size:1.05rem;padding:8px 22px}

/* groups */
.group{margin-top:22px}
.group-title{display:flex;align-items:baseline;justify-content:space-between;font-size:1rem;font-weight:600;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.g-complete .group-title{border-color:var(--ok)} .g-incomplete .group-title{border-color:var(--bad)}
.count{color:var(--muted);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px 10px;border:1px solid var(--line);border-inline-start:6px solid var(--ok)}
.card.s-incomplete{border-inline-start-color:var(--bad)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h h3{margin:0;font-size:1.15rem}
.time{font-size:.78rem;color:var(--muted);white-space:nowrap}
.reasons{margin:2px 0 6px;color:var(--bad);font-size:.88rem;font-weight:500}
.line{margin:8px 0 4px;font-weight:500}
.line.ok{color:var(--ok)} .line.bad{color:var(--bad)} .line.muted{color:var(--muted);font-weight:400}
.chips{list-style:none;padding:0;margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:2px 9px;font-size:.88rem}
.chip b{margin-inline-end:4px}
.chip small{opacity:.8;margin-inline-start:4px}
.more summary{cursor:pointer;color:var(--bad);font-size:.88rem;padding:2px 6px}
.mats{width:100%;border-collapse:collapse;margin:8px 0;font-size:.9rem}
.mats caption{text-align:start;font-weight:600;padding-bottom:4px}
.mats td,.mats th{padding:4px 2px;border-top:1px solid var(--line);text-align:start;font-weight:400}
.mats td:first-child{width:1.6em}
.mats .num{text-align:end;white-space:nowrap}
.mats tr.bad th,.mats tr.bad .num{color:var(--bad)}
.notes{background:var(--paper);border-radius:var(--r-sm);padding:6px 10px;font-size:.9rem;margin:8px 0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumb{width:62px;height:62px;border-radius:6px;overflow:hidden;border:1px solid var(--line);padding:0;cursor:pointer;background:var(--paper)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.file{font-size:1.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.thumb.file span{font-size:.55rem;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-f{display:flex;gap:6px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.pending-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.prow .btn{white-space:nowrap}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--wait-bg);border-radius:var(--r-sm);padding:6px 6px 6px 12px;padding-inline-start:12px}
.pname{font-weight:500}
.flash{animation:flash 2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--hiviz)}100%{box-shadow:0 0 0 0 transparent}}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
body.readonly [data-act="paste"],body.readonly [data-act="edit"],body.readonly [data-act="reset"],body.readonly [data-act="pasteAny"]{display:none}

/* bottom bar */
.bar{position:fixed;inset-inline:0;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1180px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.bar-in .grp{display:flex;gap:8px}

/* sheet */
dialog.sheet{border:0;padding:0;border-radius:var(--r-lg);background:var(--surface);color:var(--ink);width:min(560px,100vw - 24px);max-height:min(88vh,100%);overflow:hidden}
dialog.sheet.wide{width:min(760px,100vw - 24px)}
dialog.sheet::backdrop{background:rgba(10,16,28,.55)}
dialog.sheet.drop{outline:3px dashed var(--focus);outline-offset:-8px}
@media (max-width:640px){
  dialog.sheet,dialog.sheet.wide{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh}
}
#sheetBody{padding:18px 18px 0;overflow:auto;max-height:inherit}
.x{position:absolute;top:10px;inset-inline-end:10px;z-index:2;border:0;background:var(--paper);width:36px;height:36px;border-radius:50%;cursor:pointer}
.sh-title{margin:0 0 8px;font-size:1.2rem;padding-inline-end:40px}
.hint{color:var(--muted);font-size:.87rem;margin:4px 0 10px}
.raw{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--paper);resize:vertical;min-height:200px}
.row{display:flex;flex-wrap:wrap}.gap{gap:8px;margin:10px 0}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field span{font-weight:500;font-size:.9rem}
.field select,.field input,#notes{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;background:var(--surface);width:100%}
.okc{color:var(--ok)} .warnc{color:#9A6B00}
@media (prefers-color-scheme:dark){ .warnc{color:var(--hiviz)} }
.warn{background:var(--hiviz-bg);border-inline-start:4px solid var(--hiviz);padding:6px 10px;border-radius:6px;margin:6px 0;font-size:.9rem}
.verdict{border-radius:var(--r-sm);padding:10px 12px;margin:10px 0;font-weight:500}
.v-complete{background:var(--ok-bg);color:var(--ok)} .v-incomplete{background:var(--bad-bg);color:var(--bad)} .v-none{background:var(--wait-bg);color:var(--muted)}
.diff{border:1px dashed var(--line);border-radius:var(--r-sm);padding:6px 10px;font-size:.88rem;color:var(--muted)}
.diff p{margin:2px 0;color:var(--ink)}
.rv{border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.rv h3{font-size:1rem;margin:0 0 8px}
.revh{margin-top:14px!important}
.items{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-direction:column;gap:4px}
.tog{width:100%;display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:8px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;cursor:pointer;min-height:44px}
.item.bad .tog{background:var(--bad-bg);border-color:transparent}
.item.rev .tog{background:var(--hiviz-bg);border-color:var(--hiviz)}
.tog .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tog .st{font-size:.82rem;white-space:nowrap}
.item.ok .st{color:var(--ok)} .item.bad .st{color:var(--bad)}
.src{display:block;color:var(--muted);font-size:.76rem;padding:2px 10px 0;overflow-wrap:anywhere}
details.all{margin:10px 0}
details.all>summary{cursor:pointer;font-weight:500;padding:6px 0;color:var(--muted)}
.gh{font-size:.85rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
.um{font-size:.85rem;color:var(--muted);padding-inline-start:18px}
.mats-e{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.mat{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px}
.mat.bad{background:var(--bad-bg);border-color:transparent}
.ml{font-weight:500}
.mctl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.seg.sm{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;min-height:36px;font-size:.85rem}
.mat .seg.sm.on[data-v="1"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.mat .seg.sm.on[data-v="0"]{background:var(--bad);color:#fff;border-color:var(--bad)}
.qty{width:86px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);min-height:36px}
.unit{color:var(--muted);font-size:.85rem}
.thumbs-e{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.thumb-e{position:relative;width:78px;height:78px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center}
.thumb-e img{width:100%;height:100%;object-fit:cover}
.fic{font-size:.7rem;padding:4px;text-align:center;overflow-wrap:anywhere}
.rm{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:.75rem}
.file-btn{cursor:pointer}
.rawv,.summary{white-space:pre-wrap;background:var(--paper);border-radius:var(--r-sm);padding:10px;font-family:var(--font);font-size:.88rem;margin:0}
.sheet-actions{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:14px;border-top:1px solid var(--line)}
.archive{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.arow{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer}
.ad{font-weight:600}.ac{grid-column:1;color:var(--muted);font-size:.88rem}.as{grid-row:1/3;grid-column:2;align-self:center;font-size:.85rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;flex:none}
.sub{font-size:1rem;margin:18px 0 0;border-top:1px solid var(--line);padding-top:12px}
.viewer{margin:0}.viewer img{width:100%;height:auto;border-radius:var(--r-sm);display:block}.viewer figcaption{color:var(--muted);font-size:.85rem;margin-top:6px}
#toast{position:fixed;bottom:84px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center;font-size:.92rem}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-color-scheme:dark){ #toast{background:#E6EBF2;color:#0E1522} }
@media (max-width:640px){
  .top{position:static}
  .cards{grid-template-columns:1fr}
  .bar-in{flex-wrap:nowrap}
  .bar-in .grp{width:auto;flex:1}
  .bar-in .grp:last-child{flex:0 0 auto}
  #dateLabel{font-size:1.2rem}
  .tick{height:18px}
  .bar-in .btn{flex:1;padding:8px 8px;font-size:.88rem}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>تقارير المقاولين اليومية</h1>
      <div class="icons">
        <button class="ibtn" data-act="archive">🗂 الأرشيف</button>
        <button class="ibtn" data-act="settings" aria-label="الإعدادات">⚙️</button>
      </div>
    </div>
    <div class="when">
      <div class="date-wrap"><span id="dateLabel"></span><input id="date" type="date" aria-label="تاريخ الشفت"></div>
      <div id="shifts" role="group" aria-label="الشفت"></div>
      <span id="sessionState"></span>
    </div>
  </div>
  <div class="roster-wrap"><div id="roster" aria-label="حالة المقاولين"></div></div>
</header>

<main>
  <div class="toolbar">
    <button class="btn primary big" data-act="pasteAny">📥 لصق تقرير مقاول</button>
    <div id="tally" role="group" aria-label="فلترة حسب الحالة"></div>
    <input id="search" class="search" type="search" placeholder="بحث عن مقاول…  ( / )" aria-label="بحث عن مقاول">
  </div>
  <div id="board"></div>
</main>

<nav class="bar">
  <div class="bar-in">
    <div class="grp">
      <button class="btn" data-act="summary">📤 الملخص</button>
      <button class="btn" data-act="excel">📊 Excel</button>
    </div>
    <div class="grp"><button class="btn ghost" id="closeBtn" data-act="closeShift">🔒 إغلاق الشفت</button></div>
  </div>
</nav>

<dialog id="sheet" class="sheet"><button class="x" data-act="dismiss" aria-label="إغلاق">✕</button><div id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== CORE (pure logic, no DOM) ===================== */
(function (root) {
'use strict';

const CONTRACTORS = [
  { id: 'C01', name: 'بن شجاع',        aliases: ['بن شجاع', 'ابن شجاع'] },
  { id: 'C02', name: 'الجناحين',        aliases: ['الجناحين', 'جناحين'] },
  { id: 'C03', name: 'ايجاب',           aliases: ['ايجاب', 'إيجاب'] },
  { id: 'C04', name: 'الرؤيا المزدوجة', aliases: ['الرؤيا المزدوجة', 'الرؤية المزدوجة', 'الرويا المزدوجه', 'المزدوجة'] },
  { id: 'C05', name: 'اليمام',          aliases: ['اليمام'] },
  { id: 'C06', name: 'رسمله',           aliases: ['رسمله', 'رسملة'] },
  { id: 'C07', name: 'هضبة ادراك',      aliases: ['هضبة ادراك', 'هضبة إدراك', 'هضبه'] },
  { id: 'C08', name: 'اضاءة المدينه',   aliases: ['اضاءة المدينه', 'إضاءة المدينة', 'اضاءه المدينه'] },
  { id: 'C09', name: 'المزيد',          aliases: ['المزيد'] },
  { id: 'C10', name: 'اعراب',           aliases: ['اعراب', 'إعراب'] },
  { id: 'C11', name: 'مكتب الشرق',      aliases: ['مكتب الشرق'] },
  { id: 'C12', name: 'افق البنيه',      aliases: ['افق البنيه', 'أفق البنية'] },
  { id: 'C13', name: 'الابصار',         aliases: ['الابصار', 'الإبصار'] },
  { id: 'C14', name: 'الرايه النجديه',  aliases: ['الرايه النجديه', 'الراية النجدية', 'النجديه'] },
  { id: 'C15', name: 'الاساس العريض',   aliases: ['الاساس العريض', 'الأساس العريض'] },
  { id: 'C16', name: 'الشرهان',         aliases: ['الشرهان'] },
  { id: 'C17', name: 'الراجحي',         aliases: ['الراجحي'] },
];

const GROUPS = { DOCS: 'المستندات والإجراءات', PPE: 'معدات الوقاية', CARDS: 'البطاقات والشهادات', EQUIP: 'المعدات والأدوات' };

// kw = keywords (any), ex = exclude if present, req = must also contain one of these
const SAFETY_ITEMS = [
  { no: 1,  g: 'DOCS',  label: 'إجراءات العمل الآمن (عربي/إنجليزي/أردو)', short: 'إجراءات العمل الآمن', kw: ['اجراءات العمل الامن', 'العمل الامن', 'اجراءات العمل', 'اجراءات', 'safe work', 'method statement'] },
  { no: 2,  g: 'DOCS',  label: 'تقييم المخاطر (عربي/إنجليزي/أردو)', short: 'تقييم المخاطر', kw: ['تقييم المخاطر', 'المخاطر', 'مخاطر', 'risk assessment', 'risk'] },

/* ---------- normalization ---------- */
function toLatinDigits(s) {
  return s.replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660)
          .replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0);
}
function norm(s) {
  s = toLatinDigits(String(s || '')).toLowerCase();
  s = s.replace(/[\u064B-\u065F\u0670\u0640]/g, '');
  s = s.replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي');
  s = s.replace(/(\d)\s*[*×xX✕✖]\s*(\d)/g, '$1*$2');
  s = s.replace(/[\u200c-\u200f\u202a-\u202e\ufe0f]/g, '');
  return s.replace(/\s+/g, ' ').trim();
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const reCache = new Map();
function hasKw(n, kw) {
  if (kw.length >= 5 && !/^[a-z0-9 *-]+$/.test(kw)) return n.includes(kw);
  let re = reCache.get(kw);
  if (!re) { re = new RegExp('(^|[^\\p{L}\\p{N}])' + escRe(kw) + '(?=$|[^\\p{L}\\p{N}])', 'u'); reCache.set(kw, re); }
  return re.test(n);
}
function bestKw(n, kws) { let best = ''; for (const k of kws) if (k.length > best.length && hasKw(n, k)) best = k; return best; }

// normalize config keywords once
SAFETY_ITEMS.forEach(i => { i.kw = i.kw.map(norm); i.ex = (i.ex || []).map(norm); i.req = (i.req || []).map(norm); });
MATERIALS.forEach(m => { m.kw = m.kw.map(norm); });
CONTRACTORS.forEach(c => { c.keys = [...new Set([c.name, ...c.aliases].map(norm))]; });

/* ---------- marks ---------- */
const POS_EMOJI = /[\u2705\u2714\u2611\u2713\u{1F44D}\u{1F7E2}\u{1F7E9}]/u;
const NEG_EMOJI = /[\u274C\u274E\u2716\u2717\u2718\u{1F6AB}\u26D4\u{1F534}\u{1F7E5}]/u;
const NEG_WORDS = ['غير متوفر', 'غير متوفره', 'غير موجود', 'غير موجوده', 'غير متواجد', 'لا يوجد', 'لايوجد', 'لا توجد', 'لاتوجد', 'ما في', 'مافي', 'مو موجود', 'مب موجود', 'ماهو موجود', 'ناقص', 'ناقصه', 'مفقود', 'منتهي', 'منتهيه', 'لا', 'no', 'not available', 'missing'].map(norm);
const POS_WORDS = ['متوفر', 'متوفره', 'موجود', 'موجوده', 'متواجد', 'نعم', 'صح', 'تم', 'yes', 'ok', 'اوكي', 'available'].map(norm);

function readMark(raw, n) {
  const posE = POS_EMOJI.test(raw), negE = NEG_EMOJI.test(raw);
  let rest = n, negW = false;
  for (const w of NEG_WORDS.slice().sort((a, b) => b.length - a.length)) {
    if (hasKw(rest, w)) { negW = true; rest = rest.split(w).join(' '); }
  }
  const posW = POS_WORDS.some(w => hasKw(rest, w));
  const neg = negE || negW, pos = posE || posW;
  if (pos && neg) return 'conflict';
  if (neg) return 'no';
  if (pos) return 'yes';
  return 'none';
}

const NUM_PREFIX = /^\s*[(\[]?\s*(\d{1,2})(?:\s*[)\].\-–—:ـ\/]+\s*|\s+(?=\D))/;
function splitNumber(line) {
  const l = toLatinDigits(line);
  const m = l.match(NUM_PREFIX);
  if (!m) return { num: null, text: l };
  return { num: parseInt(m[1], 10), text: l.slice(m[0].length) };
}

/* ---------- item / material matching ---------- */
function matchSafety(n) {
  let best = null, bestLen = 0, tie = false;
  for (const it of SAFETY_ITEMS) {
    if (it.ex.some(e => hasKw(n, e))) continue;
    if (it.req.length && !it.req.some(r => hasKw(n, r))) continue;
    const k = bestKw(n, it.kw);
    if (!k) continue;
    if (k.length > bestLen) { best = it; bestLen = k.length; tie = false; }
    else if (k.length === bestLen) tie = true;
  }
  return best ? { item: best, tie } : null;
}
function matchMaterial(n) {
  let best = null, bestKey = '';
  for (const m of MATERIALS) { const k = bestKw(n, m.kw); if (k && k.length > bestKey.length) { best = m; bestKey = k; } }
  return best ? { mat: best, key: bestKey } : null;
}
function readNumber(n, key) {
  let s = n.split(key).join(' ').replace(/\d+\*\d+/g, ' ');
  const m = s.match(/(\d+(?:[.,]\d+)?)/);
  return m ? parseFloat(m[1].replace(',', '.')) : null;
}

/* ---------- contractor / shift / date ---------- */
function contractorsIn(n) {
  const found = [];
  for (const c of CONTRACTORS) { const k = bestKw(n, c.keys); if (k) found.push({ id: c.id, len: k.length }); }
  return found.sort((a, b) => b.len - a.len);
}
function detectContractor(lines) {
  const hint = lines.find(l => /مقاول|شركه|موسسه|contractor/.test(norm(l)));
  if (hint) { const f = contractorsIn(norm(hint)); if (f.length) return { id: f[0].id, confidence: 'high' }; }
  const head = contractorsIn(norm(lines.slice(0, 3).join(' ')));
  if (head.length === 1) return { id: head[0].id, confidence: 'high' };
  const all = contractorsIn(norm(lines.join(' ')));
  if (all.length === 1) return { id: all[0].id, confidence: 'medium' };
  if (all.length > 1) return { id: null, confidence: 'ambiguous', candidates: all.map(x => x.id) };
  return { id: null, confidence: 'none' };
}
function detectShift(lines, shifts) {
  const l = lines.find(x => /شفت|وردي|shift/.test(norm(x)));
  if (!l) return null;
  const n = norm(l);
  return shifts.find(s => hasKw(n, norm(s))) || null;
}
function detectDate(text) {
  const t = toLatinDigits(text);
  let m = t.match(/(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](20\d{2})/);
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return null;
}


/* ---------- main parser ---------- */
// strips WhatsApp copy prefixes "[30/09/2026, 9:15 ص] أبو فهد: " and bullets
function cleanLine(l) {
  l = String(l).trim();
  l = l.replace(/^\[[^\]]{4,40}\]\s*[^:\n]{1,40}:\s*/, '');
  l = l.replace(/^[\u2022\u25AA\u25FE\u25AB\u00B7\u25CF\u25E6\u2023\-–*]+\s*(?=\S)/u, m => /\d/.test(l.slice(m.length, m.length + 1)) ? '' : '');
  return l.trim();
}
function parseReport(rawText, opts) {
  opts = opts || {};
  const shifts = opts.shifts || [];
  const lines = String(rawText || '').replace(/\r/g, '').split('\n').map(cleanLine).filter(Boolean);

  // notes section
  let notes = '', notesIdx = lines.findIndex(l => /^(ملاحظات|ملاحظه|ملاحظة|notes?)\b/.test(norm(l)) || /^(ملاحظات|ملاحظه)/.test(norm(l)));
  const body = notesIdx >= 0 ? lines.slice(0, notesIdx) : lines;
  if (notesIdx >= 0) {
    const first = lines[notesIdx].replace(/^[^:：\-]*[:：\-]?/, '').trim();
    notes = [first, ...lines.slice(notesIdx + 1)].filter(Boolean).join('\n');
  }

  const safetyHits = {}; // id -> [{mark, conf, line}]
  const matHits = {};
  const unmatched = [];

  for (const raw of body) {
    const { num, text } = splitNumber(raw);
    const n = norm(text);
    if (!n) continue;
    const nFull = norm(raw);
    if (/^(المقاول|مقاول|اسم المقاول|التاريخ|تاريخ|اليوم|الشفت|شفت|الورديه|contractor|date|shift)/.test(nFull)) continue;
    if (/[:：]\s*$/.test(raw) && /(اشتراطات|متطلبات|المواد|السلامه)/.test(nFull)) continue;
    const mat = matchMaterial(n);
    if (mat) {
      (matHits[mat.mat.id] = matHits[mat.mat.id] || []).push({ raw, mark: readMark(raw, n.split(mat.key).join(' ')), value: readNumber(n, mat.key) });
      continue;
    }
    const ms = matchSafety(n);
    const byNum = (num && num >= 1 && num <= 35) ? SAFETY_ITEMS[num - 1] : null;
    let item = null, conf = null;
    if (ms && byNum) {
      if (ms.item.id === byNum.id) { item = byNum; conf = 'high'; }
      else { item = ms.tie ? byNum : ms.item; conf = 'low'; }
    } else if (ms) { item = ms.item; conf = ms.tie ? 'low' : 'medium'; }
    else if (byNum) { item = byNum; conf = 'medium'; }
    if (!item) { if (!/[:：]\s*$/.test(raw)) unmatched.push(raw); continue; }
    (safetyHits[item.id] = safetyHits[item.id] || []).push({ raw, mark: readMark(raw, n), conf, numId: byNum && byNum.id });
  }

  const safety = {};
  for (const it of SAFETY_ITEMS) {
    const hits = safetyHits[it.id];
    if (!hits) { safety[it.id] = { ok: false, reason: 'not_found', line: null, review: false }; continue; }
    const marks = [...new Set(hits.map(h => h.mark))];
    const line = hits.map(h => h.raw).join(' | ');
    const lowConf = hits.some(h => h.conf === 'low');
    let ok = false, reason = null, review = lowConf;
    if (marks.includes('conflict') || (marks.includes('yes') && marks.includes('no'))) { reason = 'conflict'; review = true; }
    else if (marks.includes('no')) reason = 'explicit_no';
    else if (marks.includes('yes') && !marks.includes('none')) ok = true;
    else if (marks.includes('yes')) { ok = false; reason = 'conflict'; review = true; }
    else reason = 'unmarked';
    safety[it.id] = { ok, reason: ok ? null : reason, line, review, conf: hits[0].conf };
  }

  const materials = {};
  for (const m of MATERIALS) {
    const hits = matHits[m.id];
    if (!hits) { materials[m.id] = { available: false, value: null, reason: 'not_found', line: null }; continue; }
    const h = hits[hits.length - 1];
    let available = false, value = null, reason = null;
    if (h.mark === 'no') reason = 'explicit_no';
    else if (m.type !== 'presence' && h.value != null) { value = h.value; available = h.value > 0; if (!available) { reason = 'explicit_no'; value = null; } }
    else if (h.mark === 'yes') available = true;
    else if (h.mark === 'conflict') reason = 'conflict';
    else reason = 'unmarked';
    materials[m.id] = { available, value: available ? value : null, reason, line: h.raw };
  }

  return {
    contractor: detectContractor(lines),
    shift: detectShift(lines, shifts),
    date: detectDate(rawText),
    safety, materials, notes, unmatched,
    matchedCount: Object.keys(safetyHits).length,
  };
}

/* ---------- status ---------- */
function missingIds(report) { return SAFETY_ITEMS.filter(i => report.safety && report.safety[i.id] && !report.safety[i.id].ok).map(i => i.id); }
function reportStatus(report, photoCount, settings) {
  if (!report) return 'pending';
  const s = settings || {};
  if (missingIds(report).length) return 'incomplete';
  if (s.requirePhoto && !(photoCount > 0)) return 'incomplete';
  if (s.materialsAffectStatus && MATERIALS.some(m => !report.materials[m.id] || !report.materials[m.id].available)) return 'incomplete';
  return 'complete';
}
function incompleteReasons(report, photoCount, settings) {
  const r = [], s = settings || {};
  const miss = missingIds(report).length;
  if (miss) r.push(`سلامة: ناقص ${miss}`);
  if (s.requirePhoto && !(photoCount > 0)) r.push('صور/ملفات مفقودة');
  if (s.materialsAffectStatus) { const mm = MATERIALS.filter(m => !report.materials[m.id]?.available).length; if (mm) r.push(`مواد: ${mm}`); }
  return r;
}
function materialDisplay(m, v) {
  if (!v) return { ok: false, text: '—' };
  if (m.type === 'presence') return { ok: !!v.available, text: v.available ? m.yes : m.no };
  if (!v.available) return { ok: false, text: 'غير متوفر' };
  return { ok: true, text: v.value != null ? `${fmtNum(v.value)} ${m.unit}` : 'متوفر' };
}
function fmtNum(x) { return Number.isInteger(x) ? String(x) : String(Math.round(x * 100) / 100); }
const RANK = { complete: 0, incomplete: 1, pending: 2 };
function sortContractors(list, statusOf) {
  return list.slice().sort((a, b) => RANK[statusOf(a.id)] - RANK[statusOf(b.id)] || CONTRACTORS.indexOf(a) - CONTRACTORS.indexOf(b));
}
function diffReports(prev, next) {
  if (!prev) return null;
  const nowOk = [], nowMissing = [];
  for (const it of SAFETY_ITEMS) {
    const a = prev.safety[it.id]?.ok, b = next.safety[it.id]?.ok;
    if (!a && b) nowOk.push(it); else if (a && !b) nowMissing.push(it);
  }
  return { nowOk, nowMissing };
}

function templateText(shifts) {
  const L = [];
  L.push('المقاول: ', 'التاريخ: ', `الشفت: ${shifts && shifts.length ? '(' + shifts.join(' / ') + ')' : ''}`, '');
  L.push('اشتراطات السلامة (ضع ✅ على المتوفر و ❌ على غير المتوفر):');
  for (const it of SAFETY_ITEMS) L.push(`${it.no}. ${it.label} `);
  L.push('', 'المواد الحرجة:');

      <p class="hint">على الكمبيوتر تقدر تسحب الصور وتفلتها هنا. الصور تنضغط تلقائيًا.</p>
    </section>

    ${E.raw ? `<details class="all"><summary>نص الرسالة الأصلي</summary><pre class="rawv">${esc(E.raw)}</pre></details>` : ''}

    <div class="sheet-actions">
      <button class="btn ghost" data-act="back">رجوع</button>
      <button class="btn primary" data-act="save">حفظ التقرير</button>
    </div>`, 'wide');
  hydrateThumbs($('#sheetBody'));
}

async function compressImage(file) {
  if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
  try {
    const bmp = await createImageBitmap(file);
    const max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch { return file; }
}
async function addFiles(list) {
  const arr = [...list].filter(f => f.type.startsWith('image/') || f.type === 'application/pdf');
  if (!arr.length) return;
  toast('جارِ تجهيز المرفقات…');
  for (const f of arr) { const c = await compressImage(f); E.newFiles.push({ id: uid(), name: c.name, type: c.type, size: c.size, blob: c }); }
  E.dirty = true; syncEditorInputs(); renderReview();
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
function syncEditorInputs() { const n = $('#notes'); if (n) E.notes = n.value; }

async function saveReport() {
  syncEditorInputs();
  if (!E.cid) return toast('اختر المقاول قبل الحفظ.');
  for (const m of MATERIALS) { const v = E.materials[m.id]; if (v.value != null && (isNaN(v.value) || v.value < 0)) return toast(`قيمة غير صحيحة: ${m.label}`); }
  const id = `${sessionId()}|${E.cid}`;
  const prev = S.reports.get(E.cid);
  const clean = o => JSON.parse(JSON.stringify(o));
  Object.values(E.safety).forEach(v => { v.review = false; });
  const rec = { id, sessionId: sessionId(), contractorId: E.cid, safety: clean(E.safety), materials: clean(E.materials), notes: E.notes.trim(), raw: E.raw || (prev && prev.raw) || '',
    revision: prev ? (prev.revision || 1) + 1 : 1, createdAt: prev ? prev.createdAt : Date.now(), updatedAt: Date.now(),
    history: prev ? [...(prev.history || []).slice(-9), { at: prev.updatedAt, missing: Core.missingIds(prev), revision: prev.revision }] : [] };
  const keepIds = new Set(E.files.map(f => f.id));
  const oldFiles = S.files.get(E.cid) || [];
  // if the chosen contractor changed from the one whose files were loaded, keep nothing old of the other
  await tx(['sessions', 'reports', 'files'], 'readwrite', async t => {
    await ensureSession(t);
    t.objectStore('reports').put(rec);
    const fs = t.objectStore('files');
    for (const f of oldFiles) if (!keepIds.has(f.id)) fs.delete(f.id);
    for (const f of E.newFiles) fs.put({ id: f.id, reportId: id, sessionId: sessionId(), contractorId: E.cid, name: f.name, type: f.type, size: f.size, blob: f.blob, createdAt: Date.now() });
  });
  const name = cName(E.cid);
  E.dirty = false; closeSheet();
  await loadSession(); notify();
  toast(`تم حفظ تقرير ${name}`);
  flash(null, name);
}
function flash(_, name) { const c = CONTRACTORS.find(x => x.name === name); const el = c && $('#c-' + c.id); if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); setTimeout(() => el.classList.remove('flash'), 2200); } }

async function resetReport(cid) {
  if (!confirm(`حذف تقرير ${cName(cid)} وإرجاعه إلى 🔄؟`)) return;
  const id = `${sessionId()}|${cid}`;
  await tx(['reports', 'files'], 'readwrite', t => { t.objectStore('reports').delete(id); (S.files.get(cid) || []).forEach(f => t.objectStore('files').delete(f.id)); });
  await loadSession(); notify(); toast('تم حذف التقرير');
}

/* ---------- close / reopen ---------- */
async function setSessionStatus(status) {
  await tx(['sessions'], 'readwrite', async t => { const s = await ensureSession(t); s.status = status; s[status === 'closed' ? 'closedAt' : 'reopenedAt'] = Date.now(); t.objectStore('sessions').put(s); });
  await loadSession(); notify();
}

/* ---------- WhatsApp summary ---------- */
function summaryText() {
  const by = st => CONTRACTORS.filter(c => statusOf(c.id) === st);
  const L = ['📋 تقرير المقاولين اليومي', `📅 ${fmtDate(S.date)} — الشفت: ${S.shift}`, `✅ ${by('complete').length} | ❌ ${by('incomplete').length} | 🔄 ${by('pending').length}`, ''];
  if (by('complete').length) L.push('✅ مكتمل:', by('complete').map(c => c.name).join('، '), '');
  if (by('incomplete').length) {
    L.push('❌ ناقص:');
    for (const c of by('incomplete')) {
      const r = S.reports.get(c.id), miss = SAFETY_ITEMS.filter(i => !r.safety[i.id].ok);
      const parts = [];
      if (miss.length) parts.push('سلامة: ' + miss.map(i => i.short).join('، '));
      if (S.settings.requirePhoto && !photoCount(c.id)) parts.push('صور مفقودة');
      if (S.settings.materialsAffectStatus) { const mm = MATERIALS.filter(m => !r.materials[m.id]?.available); if (mm.length) parts.push('مواد: ' + mm.map(m => m.label).join('، ')); }
      L.push(`• ${c.name} — ${parts.join(' | ')}`);
    }
    L.push('');
  }
  if (by('pending').length) L.push('🔄 غير متجاوب:', by('pending').map(c => c.name).join('، '), '');
  const matLines = CONTRACTORS.filter(c => S.reports.has(c.id)).map(c => { const mm = MATERIALS.filter(m => !S.reports.get(c.id).materials[m.id]?.available); return mm.length ? `• ${c.name}: ${mm.map(m => m.label).join('، ')}` : null; }).filter(Boolean);
  if (matLines.length) L.push('📦 مواد حرجة غير متوفرة:', ...matLines);
  return L.join('\n').trim();
}
function openSummary() {
  const t = summaryText();
  openSheet(`<h2 class="sh-title">📤 ملخص الشفت</h2><pre class="summary">${esc(t)}</pre>
    <div class="sheet-actions"><button class="btn ghost" data-act="close">إغلاق</button>
    <a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">فتح واتساب</a>
    <button class="btn primary" data-act="copySummary">نسخ الملخص</button></div>`);
}

/* ---------- Excel ---------- */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('تعذر تحميل مكتبة Excel. تأكد من الاتصال.')); document.head.appendChild(s); });
}
async function exportExcel() {
  try { await loadXLSX(); } catch (e) { return toast(e.message); }
  const ordered = Core.sortContractors(CONTRACTORS, statusOf);
  const sum = [['م', 'المقاول', 'الحالة', 'عدد النواقص', 'العناصر الناقصة', 'المرفقات', 'الملاحظات', 'آخر تحديث']];
  ordered.forEach((c, i) => { const r = S.reports.get(c.id), st = statusOf(c.id);
    const miss = r ? SAFETY_ITEMS.filter(x => !r.safety[x.id].ok) : [];
    sum.push([i + 1, c.name, `${ICON[st]} ${LABEL[st]}`, r ? miss.length : '', miss.map(x => `${x.no}- ${x.short}`).join('، '), r ? photoCount(c.id) : '', r?.notes || '', r ? fmtTime(r.updatedAt) : '']); });
  const mat = [['المقاول', ...SAFETY_ITEMS.map(i => `${i.no}. ${i.short}`)]];
  ordered.forEach(c => { const r = S.reports.get(c.id); mat.push([c.name, ...SAFETY_ITEMS.map(i => !r ? '🔄' : r.safety[i.id].ok ? '✅' : '❌')]); });
  const cm = [['المقاول', ...MATERIALS.map(m => m.label)]];
  ordered.forEach(c => { const r = S.reports.get(c.id); cm.push([c.name, ...MATERIALS.map(m => !r ? '🔄' : Core.materialDisplay(m, r.materials[m.id]).text)]); });
  const wb = XLSX.utils.book_new();
  const add = (rows, name, widths) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = widths; XLSX.utils.book_append_sheet(wb, ws, name); };
  add(sum, 'ملخص', [{ wch: 4 }, { wch: 18 }, { wch: 14 }, { wch: 10 }, { wch: 60 }, { wch: 9 }, { wch: 40 }, { wch: 11 }]);
  add(mat, 'مصفوفة السلامة', [{ wch: 18 }, ...SAFETY_ITEMS.map(() => ({ wch: 12 }))]);
  add(cm, 'المواد الحرجة', [{ wch: 18 }, ...MATERIALS.map(() => ({ wch: 16 }))]);
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.writeFile(wb, `تقارير_المقاولين_${S.date}_${S.shift}.xlsx`);
}

/* ---------- archive ---------- */
async function openArchive() {
  const sessions = (await getAll('sessions')).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt - a.createdAt));
  const reps = await getAll('reports');
  const files = await getAll('files');
  const fc = {}; files.forEach(f => { const k = f.sessionId + '|' + f.contractorId; fc[k] = (fc[k] || 0) + 1; });
  const rows = sessions.map(s => {
    const rs = reps.filter(r => r.sessionId === s.id);
    const c = { complete: 0, incomplete: 0 };
    rs.forEach(r => c[Core.reportStatus(r, fc[s.id + '|' + r.contractorId] || 0, S.settings)]++);
    const pending = CONTRACTORS.length - rs.length;
    return `<li><button class="arow" data-open="${esc(s.id)}"><span class="ad">${fmtDate(s.date)} — ${esc(s.shift)}</span>
      <span class="ac">✅ ${c.complete} · ❌ ${c.incomplete} · 🔄 ${pending}</span><span class="as">${s.status === 'closed' ? '🔒 مغلق' : 'مفتوح'}</span></button></li>`;
  }).join('');
  openSheet(`<h2 class="sh-title">🗂 الأرشيف</h2>${rows ? `<ul class="archive">${rows}</ul>` : `<p class="empty">ما فيه شفتات محفوظة للحين. أول تقرير تحفظه يفتح الشفت ويظهر هنا.</p>`}
    <div class="sheet-actions"><button class="btn ghost" data-act="close">إغلاق</button></div>`);
}

/* ---------- settings / backup ---------- */
function openSettings() {
  const s = S.settings;
  openSheet(`<h2 class="sh-title">⚙️ الإعدادات</h2>
    <label class="check"><input type="checkbox" id="setPhoto" ${s.requirePhoto ? 'checked' : ''}> التقرير بدون صور أو ملفات يُعتبر ❌ ناقص</label>
    <label class="check"><input type="checkbox" id="setMat" ${s.materialsAffectStatus ? 'checked' : ''}> نقص أي مادة حرجة يجعل التقرير ❌ ناقص</label>
    <label class="field"><span>الشفتات (افصل بفاصلة)</span><input id="setShifts" value="${esc(s.shifts.join('، '))}"></label>
    <h3 class="sub">النسخ الاحتياطي</h3>
    <p class="hint">البيانات محفوظة داخل هذا المتصفح فقط. خذ نسخة احتياطية بشكل دوري، وتقدر تنقلها لجهاز ثاني.</p>
    <div class="row gap"><button class="btn ghost" data-act="backup">⬇️ تنزيل نسخة احتياطية</button>
    <label class="btn ghost file-btn">⬆️ استرجاع نسخة<input id="restoreIn" type="file" accept="application/json,.json" hidden></label></div>
    <div class="sheet-actions"><button class="btn ghost" data-act="close">إلغاء</button><button class="btn primary" data-act="saveSettings">حفظ الإعدادات</button></div>`);
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function backup() {
  toast('جارِ تجهيز النسخة…');
  const files = await getAll('files');
  const data = { app: 'contractors-daily-reports', version: 1, exportedAt: new Date().toISOString(), settings: S.settings,
    sessions: await getAll('sessions'), reports: await getAll('reports'),
    files: await Promise.all(files.map(async f => ({ ...f, blob: undefined, data: await blobToDataURL(f.blob) }))) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `نسخة_تقارير_المقاولين_${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function restore(file) {
  let data; try { data = JSON.parse(await file.text()); } catch { return toast('الملف غير صالح.'); }
  if (data.app !== 'contractors-daily-reports') return toast('هذا الملف مو نسخة من هذا التطبيق.');
  if (!confirm(`استرجاع ${data.sessions.length} شفت و${data.reports.length} تقرير؟ السجلات المتطابقة بتُستبدل.`)) return;
  const files = await Promise.all(data.files.map(async f => ({ ...f, data: undefined, blob: await (await fetch(f.data)).blob() })));
  await tx(['sessions', 'reports', 'files', 'meta'], 'readwrite', t => {
    data.sessions.forEach(x => t.objectStore('sessions').put(x));
    data.reports.forEach(x => t.objectStore('reports').put(x));
    files.forEach(x => t.objectStore('files').put(x));
    if (data.settings) t.objectStore('meta').put({ key: 'settings', value: data.settings });
  });
  await loadSettings(); closeSheet(); await loadSession(); notify(); toast('تم الاسترجاع');
}

/* ---------- viewer ---------- */
function viewFile(id) {
  const f = allFiles().find(x => x.id === id); if (!f) return;
  if (!f.type.startsWith('image/')) { window.open(fileURL(f), '_blank'); return; }
  openSheet(`<figure class="viewer"><img src="${fileURL(f)}" alt="${esc(f.name)}"><figcaption>${esc(cName(f.contractorId))} — ${esc(f.name)}</figcaption></figure>
    <div class="sheet-actions"><button class="btn ghost" data-act="close">إغلاق</button></div>`, 'wide');
}

/* ---------- toast ---------- */
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
async function copy(text, done) { try { await navigator.clipboard.writeText(text); toast(done); } catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(done); } }

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button, [data-open]'); if (!b) return;
  const d = b.dataset;
  if (d.shift) { S.shift = d.shift; localStorage.setItem('cdr-shift', S.shift); return loadSession(); }
  if (d.filter) { S.filter = d.filter; return render(); }
  if (d.jump) { S.filter = 'all'; render(); const el = $('#c-' + d.jump); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1800); } return; }
  if (d.view) return viewFile(d.view);
  if (d.open) { const s = await getOne('sessions', d.open); closeSheet(); S.date = s.date; S.shift = s.shift; if (!S.settings.shifts.includes(s.shift)) S.settings.shifts.push(s.shift); return loadSession(); }
  if (d.item && E) { const v = E.safety[d.item]; syncEditorInputs(); E.safety[d.item] = { ...v, ok: !v.ok, reason: v.ok ? 'manual' : null, review: false }; E.dirty = true; const open = [...document.querySelectorAll('#sheetBody details')].map(x => x.open); const y = $('#sheetBody').scrollTop; renderReview(); document.querySelectorAll('#sheetBody details').forEach((x, i) => x.open = !!open[i]); $('#sheetBody').scrollTop = y; return; }
  if (d.mat && E) { syncEditorInputs(); const m = E.materials[d.mat]; const on = d.v === '1'; E.materials[d.mat] = { ...m, available: on, value: on ? m.value : null, reason: on ? null : 'manual' }; E.dirty = true; const y = $('#sheetBody').scrollTop; renderReview(); $('#sheetBody').scrollTop = y; return; }
  if (d.rmfile && E) { syncEditorInputs(); E.files = E.files.filter(f => f.id !== d.rmfile); E.newFiles = E.newFiles.filter(f => f.id !== d.rmfile); E.dirty = true; renderReview(); return; }
  switch (d.act) {
    case 'paste': return openPaste(d.cid);
    case 'edit': return openEdit(d.cid);
    case 'reset': return resetReport(d.cid);
    case 'parse': return doParse();
    case 'manual': return manualEntry();
    case 'allok': syncEditorInputs(); SAFETY_ITEMS.forEach(i => E.safety[i.id] = { ok: true, reason: null, line: null }); return renderReview();
    case 'template': return copy(Core.templateText(S.settings.shifts), 'تم نسخ النموذج. أرسله للمقاولين مرة وحدة.');
    case 'back': { if (E && E.dirty && !confirm('بتفقد التعديلات. متأكد؟')) return; if (E && E.parsed) { const raw = E.raw, cid = E.cid; openPaste(cid); $('#raw').value = raw; return; } return closeSheet(); }
    case 'dismiss': if (E && E.dirty && !confirm('في تعديلات ما انحفظت. تبي تطلع بدون حفظ؟')) return; return closeSheet();
    case 'save': return saveReport();
    case 'close': return closeSheet();
    case 'summary': return openSummary();
    case 'copySummary': return copy(summaryText(), 'تم نسخ الملخص');
    case 'excel': return exportExcel();
    case 'archive': return openArchive();
    case 'settings': return openSettings();
    case 'backup': return backup();
    case 'closeShift': if (confirm(`إغلاق شفت ${S.shift} ليوم ${fmtDate(S.date)}؟ يصير للقراءة فقط.`)) { await setSessionStatus('closed'); toast('تم إغلاق الشفت'); } return;
    case 'reopen': if (confirm('إعادة فتح الشفت للتعديل؟')) { await setSessionStatus('open'); toast('تم فتح الشفت'); } return;
    case 'saveSettings': {
      const shifts = $('#setShifts').value.split(/[،,]/).map(x => x.trim()).filter(Boolean);
      if (!shifts.length) return toast('لازم شفت واحد على الأقل.');
      S.settings = { requirePhoto: $('#setPhoto').checked, materialsAffectStatus: $('#setMat').checked, shifts };
      if (!shifts.includes(S.shift)) S.shift = shifts[0];
      await saveSettings(); closeSheet(); await loadSession(); toast('تم حفظ الإعدادات'); return;
    }
    case 'pasteAny': return openPaste(null);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'date') { if (e.target.value) { S.date = e.target.value; loadSession(); } }
  if (e.target.id === 'cid' && E) { syncEditorInputs(); const was = E.cid; E.cid = e.target.value || null; if (E.cid !== was) { E.files = E.cid ? (S.files.get(E.cid) || []).slice() : []; E.prev = E.cid ? S.reports.get(E.cid) : null; E.warn = null; } E.dirty = true; renderReview(); }
  if (e.target.id === 'fileIn' && E) addFiles(e.target.files);
  if (e.target.id === 'restoreIn') restore(e.target.files[0]);
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') { S.search = e.target.value; render(); }
  if (e.target.dataset.qty && E) {
    const id = e.target.dataset.qty, raw = e.target.value, v = raw === '' ? null : parseFloat(raw);
    const m = E.materials[id];
    E.materials[id] = { ...m, value: v, available: v != null && v > 0 ? true : (v === 0 ? false : m.available), reason: v != null && v > 0 ? null : m.reason };
    E.dirty = true;
    const li = e.target.closest('.mat'); li.classList.toggle('ok', E.materials[id].available); li.classList.toggle('bad', !E.materials[id].available);
    li.querySelectorAll('.seg').forEach(s => s.classList.toggle('on', (s.dataset.v === '1') === E.materials[id].available));
  }
  if (e.target.id === 'notes' && E) E.dirty = true;
});
sheet.addEventListener('dragover', e => { if (E && E.step === 'review') { e.preventDefault(); sheet.classList.add('drop'); } });
sheet.addEventListener('dragleave', () => sheet.classList.remove('drop'));
sheet.addEventListener('drop', e => { sheet.classList.remove('drop'); if (E && E.step === 'review') { e.preventDefault(); addFiles(e.dataTransfer.files); } });
window.addEventListener('beforeunload', e => { if (E && E.dirty) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !sheet.open && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); $('#search').focus(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && E && E.step === 'review') { e.preventDefault(); saveReport(); }
});

/* ---------- boot ---------- */
(async function boot() {
  try { db = await openDB(); } catch { document.body.innerHTML = '<p class="empty">المتصفح منع التخزين المحلي. افتح الصفحة في متصفح عادي (مو وضع التصفح الخفي).</p>'; return; }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  await loadSettings();
  const saved = localStorage.getItem('cdr-shift');
  const h = new Date().getHours();
  S.shift = S.settings.shifts.includes(saved) ? saved : (S.settings.shifts[h >= 15 && S.settings.shifts.length > 1 ? 1 : 0]);
  await loadSession();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
